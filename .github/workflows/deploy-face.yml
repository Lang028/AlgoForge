name: Build and deploy face_service

on:
  push:
    branches:
      - master
      - feature/demo-ready
    paths:
      - "face_service/**"
      - ".github/workflows/deploy-face.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/lang028/algoforge-face

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: face_service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: algoforge-face-hg2026
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FACE }}
          images: ${{ env.IMAGE }}:${{ github.sha }}
