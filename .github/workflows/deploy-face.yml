name: Build and deploy face_service

on:
  push:
    branches:
      - master
      - feature/demo-ready
    paths:
      - "face_service/**"
      - ".github/workflows/deploy-face.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/lang028/algoforge-face
  # Lifted into env so the deploy steps can test for it -- `if:` cannot read `secrets`.
  AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: face_service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      # See deploy-web.yml -- container deploys need management-API auth, which the
      # publish profile does not provide. Skipped until AZURE_CREDENTIALS exists.
      - name: Log in to Azure
        if: env.AZURE_CREDENTIALS != ''
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        if: env.AZURE_CREDENTIALS != ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: algoforge-face-hg2026
          images: ${{ env.IMAGE }}:${{ github.sha }}
